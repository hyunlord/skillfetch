# Hand-labelled skill-level relations for tests/fixtures/skills/.
#
# This file is the contract for resolve/ (constraints.md §7). Every unordered pair
# of fixture skills that is NOT listed here is expected to be `independent`.
# Each pair may appear at most once in this file. Pairs are unordered, except
# under `subsumes`, which is directional.
#
# Constraints for each skill are hand-labelled in <skill>/constraints.json, with
# evidence line numbers pointing into that skill's SKILL.md.

conflict:
  # commit-granularity: require squash vs forbid squash
  - [commit-squash, atomic-commits]
  - [commit-squash, small-commits]
  # emoji: same object ("in headers"), opposite directives
  - [emoji-headers, clean-headings]
  # order: tests before implementation vs implementation before tests
  - [tdd-strict, prototype-first]
  - [red-green-refactor, prototype-first]
  # package-manager: forbid npm vs require npm
  - [pnpm-only, npm-classic]
  - [pnpm-monorepo, npm-classic]
  # formatter: forbid black vs require black
  - [black-formatter, ruff-format]
  # exclusive subjects (§1.1): two different choices from the same ecosystem,
  # stated only positively — no skill forbids the other's choice
  - [uv-python, poetry-python]          # package-manager, python
  - [jest-tests, vitest-tests]          # test-runner, javascript
  - [vite-build, webpack-build]         # build-tool, javascript
  # "Use any package manager except npm" vs "Always install dependencies with npm": the
  # old extraction read the "except" object as a choice and 8a held it back; it means
  # forbid npm, and the two cannot both be followed, so it is a conflict by definition.
  # Against pnpm it is subsumed, against uv or poetry independent (below).
  - [any-but-npm, npm-classic]

redundant:
  # equal constraint multisets, different wording: redundant in both directions
  - [atomic-commits, small-commits]
  - [plain-markdown, no-emoji-docs]
  - [tdd-strict, red-green-refactor]
  - [concise-responses, terse-mode]
  - [pnpm-only, pnpm-monorepo]

subsumes:
  # [superset, subset]: the subset's constraints are all in the superset, so the
  # subset is redundant once the superset is in the set (not the other way round)
  - [typed-python, type-hints-strict]
  # scope containment (constraints.md §4): minimal-scripts bans type hints
  # everywhere, which contains django-migrations' ban limited to migrations
  - [minimal-scripts, django-migrations]
  # pnpm-only and pnpm-monorepo forbid npm themselves, so any-but-npm's one constraint
  # ("Use any package manager except npm" = forbid npm) is in both: subsumed, and both
  # can be followed. Against uv or poetry the ban is independent.
  - [pnpm-only, any-but-npm]
  - [pnpm-monorepo, any-but-npm]

tension:
  # bullet-points: soft blanket ban (any artifact) vs a narrow requirement (PR
  # descriptions) — the negative side is broader, so the two are opposed
  - [prose-only, pr-checklist]

needs_review:
  # object-less hard pairs (constraints.md §3 row 14d): real contradictions, capped by
  # the default conflict cap ("all"); conflicts under --conflict-cap vocabulary
  - [emoji-headers, plain-markdown]          # emoji: blanket ban vs emoji in headers
  - [emoji-headers, no-emoji-docs]
  - [type-hints-strict, minimal-scripts]     # type hints: required vs forbidden
  - [typed-python, minimal-scripts]          # type hints, docstrings
  - [concise-responses, explain-everything]  # preamble: forbidden vs required
  - [terse-mode, explain-everything]
  - [concise-responses, change-summary]      # summary-at-end: forbidden vs required
  - [terse-mode, change-summary]
  # type-hints: forbidden only under a condition
  - [type-hints-strict, django-migrations]
  - [typed-python, django-migrations]
  # emoji: general "use emoji" vs a carve-out "not in headers"
  - [friendly-tone, clean-headings]
  # scope carve-outs: the positive side has the broader scope, so the ban reads
  # as an exception ("use emoji, but not in Markdown")
  - [friendly-tone, plain-markdown]
  - [friendly-tone, no-emoji-docs]
  # "always ask" (any phase) vs "never ask during implementation"; recall cost
  # accepted: in practice most file edits happen during implementation
  - [act-autonomously, careful-agent]
  - [verbose-logging, quiet-tests]
  # The caps of §3 row 14, each on a real case (constraints as extracted, see the
  # fixtures' "note"); every one of them is a conflict without its cap.
  # 14a fan-out: "Nothing was shortened to save space" (uasl/output-skill) against
  # three distinct "keep it short" skills
  - [output-checklist, brief-answers]
  - [output-checklist, caveman-terse]
  - [output-checklist, one-sentence-review]
  # 14b polarity: "Ignore error messages" under "❌ Don't" (uasl/n8n-validation-expert)
  # vs "Don't skip past errors or warnings" (uasl/systematic-debugging)
  - [validation-donts, debug-before-fix]
  # 14c narrowed: "Proper error handling with actionable messages" (anthropics mcp-builder)
  # vs "Don't Swallow Errors" (uasl/error-handling-patterns), both object-less
  - [server-quality, error-practices]

# The pairs above that are conflicts under `--conflict-cap vocabulary`.
conflict_with_vocabulary_cap:
  - [emoji-headers, plain-markdown]          # emoji: blanket ban vs emoji in headers
  - [emoji-headers, no-emoji-docs]
  - [type-hints-strict, minimal-scripts]     # type hints: required vs forbidden
  - [typed-python, minimal-scripts]          # type hints, docstrings
  - [concise-responses, explain-everything]  # preamble: forbidden vs required
  - [terse-mode, explain-everything]
  - [concise-responses, change-summary]      # summary-at-end: forbidden vs required
  - [terse-mode, change-summary]

# Deliberate near misses that must stay `independent` (listed for readers; the
# test derives them from "not listed above"):
#   inline-comments / self-documenting   same subject, different objects
#   gitmoji-commits / plain-markdown     same subject, disjoint artifacts
#   pnpm-only / pnpm-monorepo pair (require pnpm, forbid npm) differ in object
#   pdf-reference / glossary-reference   no constraints is not redundancy
#   https-links / no-plain-http          https is not http (terms.STOPLIST): "always
#                                        https" and "never http" agree; a conflict
#                                        under the old naive singular
#   jest-tests / tdd-strict              exclusive control: test-runner, both must,
#                                        same scope, but jest and pytest belong to
#                                        different ecosystems
