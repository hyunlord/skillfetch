[project]
name = "skillfetch"
version = "0.0.1"
description = "Zero-install skills for coding agents: vetted corpus, conflict-free skill sets."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
skillfetch = "skillfetch.cli:main"

[project.optional-dependencies]
ingest = [
    "anthropic>=1.0",
    "openai>=3.35.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillfetch"]

# the skills `skillfetch setup` installs (src/skillfetch/setup.py reads them from here in a
# wheel, from assets/ in a source checkout)
[tool.hatch.build.targets.wheel.force-include]
"assets/vet-skill/SKILL.md" = "skillfetch/_assets/vet-skill/SKILL.md"
"assets/router-skill/SKILL.md" = "skillfetch/_assets/router-skill/SKILL.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# published experiment scripts are kept byte-for-byte (their hashes are frozen)
extend-exclude = ["evals/e2e", "evals/knowledge-gap"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
