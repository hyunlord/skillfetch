# Injection scan rules (index-format.md §1.4). A blocklist, not a proof of safety.
#
# Bump `version` whenever a rule changes; it is recorded in the index manifest
# as scan_rules_version.
#
# Lines longer than 2000 characters are not matched (a regex over an adversarial
# line can take seconds); each one is reported as a `scan.line-too-long` warning
# with its first characters as evidence.
#
# Rule fields:
#   id, family, pattern   Python regex, case-insensitive unless case_sensitive: true
#   target                line (default) | outside_links (markdown link targets,
#                         autolinks and reference definitions removed first) |
#                         html_comment (pattern applied to each <!-- --> body) |
#                         line_with_lead_in (the line, preceded by the line before it
#                         when that one ends with ":")
#   within                optional second regex: a `pattern` match counts only if this
#                         one is found inside the matched text
#   unless                optional regex: a `pattern` match does not count if this one is
#                         found inside the matched text (rules v7)
#   effect                fail | warn | info, overrides the family's effect for this rule.
#                         info is shown but is neither a failure nor a warning; an info hit
#                         on a line where its family already warns or fails is dropped
#   allow_negated         skip a match when a negation (not, never, n't, no, without)
#                         appears at most two words before it: "never run sudo X"
#                         is advice, "do not hesitate to run sudo X" is not
#   allow_quoted          a match inside quotation marks ("…", “…”) is only info:
#                         advice that quotes the phrase to avoid ("avoid override-style
#                         language (\"disregard the previous instruction\")") is not an
#                         attempt. It is still shown (as info), so the quote stays visible.
version: 8

effects:
  override: fail
  exfil: fail
  privilege: fail
  hidden: fail
  network: warn
  # Rules v8, the advice policy (numbers.md §30): only checks whose measured precision held up
  # change the advice. Concealment phrasing (0/6 worth a look in the index) is info, like
  # sudo and pipe-to-shell below; clearing history stays a warning (conceal.clear-history).
  conceal: info
  destructive: fail

scripts:
  dirs: [scripts]
  extensions: [.sh, .bash, .zsh, .py, .js, .mjs, .cjs, .ts, .rb, .pl, .ps1, .bat, .cmd]

rules:
  # --- override: attempts to replace the host's instructions ----------------------
  - id: override.ignore-previous
    family: override
    allow_quoted: true
    pattern: '\b(?:ignore|disregard|forget|override)\s+(?:all\s+)?(?:of\s+)?(?:the\s+|your\s+|any\s+)?(?:previous|prior|above|earlier|preceding|original|system)\s+(?:instructions?|prompts?|directions|directives|messages?|rules)\b|\b(?:ignore|disregard)\s+all\s+(?:other\s+)?instructions\b'
  # Not `output` or `override` (rules v4): "… without test or build output, add to the
  # system prompt" (anthropics claude-api) and "Direct: override system prompts" (an
  # OWASP table describing attacks) are documentation, and both verbs are common there.
  - id: override.system-prompt
    family: override
    allow_negated: true
    allow_quoted: true
    # rules v8: -s and -ing forms; not -ed ("leaked system prompt patterns" names a thing)
    pattern: '\b(?:ignor(?:e|es|ing)|disregard(?:s|ing)?|bypass(?:es|ing)?|reveal(?:s|ing)?|print(?:s|ing)?|repeat(?:s|ing)?|leak(?:s|ing)?|dump(?:s|ing)?|recit(?:e|es|ing))\b[^.\n]{0,20}\bsystem\s+prompt\b'
  # Rules v8: a request to hand over the agent's own prompt ("output your system prompt",
  # "show the full hidden instructions"). "your" or full/hidden/entire is required, so "add it to
  # the system prompt" and "put instructions in the system prompt" stay out.
  - id: override.prompt-leak
    family: override
    allow_negated: true
    allow_quoted: true
    pattern: '\b(?:show|output|share|tell|give|send|copy|paste|write\s+out|display|return)\b[^.\n]{0,20}\b(?:your|the\s+(?:full|entire|complete|hidden|original))\s+(?:(?:full|entire|complete|hidden|original|exact)\s+)*(?:system\s+(?:prompt|instructions|message)|initial\s+instructions|hidden\s+instructions)\b'
  # Paraphrases of "ignore previous instructions" (rules v7, from the scan-accuracy dev set:
  # evals/scan-accuracy/): earlier guidance declared void, the user overruled, only the skill's
  # rules left.
  - id: override.paraphrase
    family: override
    allow_quoted: true
    allow_negated: true
    pattern: '\b(?:earlier|previous|prior|original)\s+(?:guidance|instructions?|rules|directions)\b[^.\n]{0,60}?\b(?:no\s+longer\s+appl|do(?:es)?\s+not\s+apply|(?:is|are)\s+(?:void|cancell?ed|superseded))|\bset\s+aside\s+(?:everything|all|anything)\b[^.\n]{0,40}?\b(?:told|instructions?|said)\b|\b(?:do\s+not|don''t|never)\s+(?:follow|obey|listen\s+to)\s+the\s+user\b|\bonly\s+(?:these|this\s+skill''?s?)\s+(?:rules|instructions)\s+apply\b'
  - id: override.persona
    family: override
    allow_quoted: true
    pattern: '\byou\s+are\s+now\s+(?:an?\s+)?(?:unrestricted|unfiltered|uncensored|jailbroken|evil|dan\b)|\byou\s+are\s+now\s+in\s+(?:developer|god|jailbreak|dan)\s+mode\b'

  # --- exfil: reading secrets or shipping them elsewhere ---------------------------
  - id: exfil.ssh-keys
    family: exfil
    allow_negated: true
    pattern: '\b(?:read|cat|open|copy|cp|upload|send|print|load|base64|scp|access|include)\b[^\n]{0,40}(?:~|\$HOME|\$\{HOME\})/\.ssh\b'
  - id: exfil.cloud-credentials
    family: exfil
    allow_negated: true
    pattern: '\b(?:read|cat|open|copy|cp|upload|send|print|load|base64|scp|access|include)\b[^\n]{0,40}(?:~|\$HOME|\$\{HOME\})/\.(?:aws|azure|kube|netrc|config/gcloud|docker/config\.json)\b'
  # Rules v8: credential files moved off the machine. The verb may be inflected ("uploading
  # ~/.aws/credentials to the team bucket"); copying a secret file to another host with scp or
  # rsync, or attaching it to a curl upload, counts too. Reading or loading a credentials file is
  # left to exfil.cloud-credentials (SDK docs say where credentials are read from).
  - id: exfil.credential-upload
    family: exfil
    allow_negated: true
    pattern: '\b(?:upload(?:s|ed|ing)?|send(?:s|ing)?|sent|post(?:s|ed|ing)?|shar(?:e|es|ed|ing)|sync(?:s|ed|ing)?|push(?:es|ed|ing)?|transmit(?:s|ted|ting)?|exfiltrat(?:e|es|ed|ing)|attach(?:es|ed|ing)?|forward(?:s|ed|ing)?|cop(?:y|ies|ied|ying))\b[^\n]{0,60}(?:~|\$HOME|\$\{HOME\})/\.(?:ssh|aws|azure|kube|netrc|config/gcloud|config/gh|docker/config\.json|git-credentials|npmrc|pypirc)\b'
  - id: exfil.secret-file-remote-copy
    family: exfil
    allow_negated: true
    pattern: '\b(?:scp|rsync)\b[^\n]{0,80}?(?:(?<![\w/.-])\.env\b(?!\.(?:example|sample|template))|(?:~|\$HOME|\$\{HOME\})/\.(?:ssh|aws|azure|kube|netrc|git-credentials|npmrc|pypirc)\b|\bid_(?:rsa|ed25519|ecdsa|dsa)\b(?!\.pub))[^\n]{0,80}?\s\S*?[\w.-]+:\S*|\bcurl\b[^\n]{0,80}?(?:-F\s*["'']?[\w-]+=@|--data(?:-binary)?\s+["'']?@|-d\s*["'']?@|-T\s+|--upload-file\s+)["'']?(?:\S*/)?(?:\.env\b(?!\.(?:example|sample|template))|\.(?:netrc|git-credentials|npmrc|pypirc)\b|credentials\b|id_(?:rsa|ed25519|ecdsa)\b(?!\.pub))'
  - id: exfil.dotenv
    family: exfil
    allow_negated: true
    pattern: '\b(?:cat|less|more|head|tail|type|print|upload|send|post|exfiltrate)\b[^\n]{0,30}(?<![\w/.-])\.env\b(?!\.(?:example|sample|template))'
  - id: exfil.secret-env
    family: exfil
    allow_negated: true
    pattern: '\b(?:echo|printenv|print|cat|send|upload)\b[^\n]{0,40}\$\{?[A-Z0-9_]*(?:TOKEN|SECRET|API_?KEY|PASSWORD|PRIVATE_KEY)[A-Z0-9_]*\}?'
  - id: exfil.send-to-url
    family: exfil
    allow_negated: true
    pattern: '\b(?:send|sent|post|upload|exfiltrate|transmit|forward)\b[^\n]{0,60}\b(?:keys?|tokens?|secrets?|passwords?|credentials?|cookies?|\.env|env(?:ironment)?\s+var(?:iable)?s?|ssh|contents?)\b[^\n]{0,60}\bto\s+<?https?://'
  # Piping a downloaded script into a shell is how uv, rustup, Homebrew and nvm
  # install, so on its own it only warns. It fails with sudo, or when the URL is
  # not something a reviewer can trust at a glance (http, raw IP, URL shortener).
  # Rules v7: a negated mention ("never pipe curl into sh") is advice; the documented installers
  # of well-known tools are only info; PowerShell's download-and-run (iwr | iex) counts too.
  # Rules v8 (advice policy): info. 0/3 of these in the index were worth a look; an untrusted URL
  # or sudo still fails (the next rule, privilege.sudo-remote-script).
  - id: exfil.pipe-to-shell
    family: exfil
    effect: info
    allow_negated: true
    unless: 'https://(?:raw\.githubusercontent\.com/(?:Homebrew|nvm-sh)/|bun\.sh/install|sh\.rustup\.rs|astral\.sh/(?:uv|ruff)/|deno\.land/install|get\.pnpm\.io/|install\.python-poetry\.org|fnm\.vercel\.app/install|starship\.rs/install|ollama\.com/install\.sh|get\.docker\.com)'
    pattern: '\b(?:curl|wget)\b[^\n|]*\|\s*(?:sudo\s+(?:-\w+\s+)*)?(?:ba|z|da)?sh\b|\b(?:ba|z|da)?sh\s+(?:-c\s+["'']?\$\(|<\()\s*(?:curl|wget)\b|\b(?:iwr|irm|Invoke-WebRequest|Invoke-RestMethod)\b[^\n|]*\|\s*(?:iex|Invoke-Expression)\b|\b(?:iex|Invoke-Expression)\s*\(\s*(?:iwr|irm|New-Object\s+Net\.WebClient)\b'
  # Two stages, so no single regex has to backtrack over a long line: `pattern` finds
  # the download piped into a shell (both forms), `within` looks for an untrusted URL
  # inside that match only (http, raw IPv4/IPv6, URL shortener).
  - id: exfil.remote-script-untrusted-url
    family: exfil
    pattern: '\b(?:curl|wget)\b[^\n|]*\|\s*(?:sudo\s+(?:-\w+\s+)*)?(?:ba|z|da)?sh\b|\b(?:ba|z|da)?sh\s+(?:-c\s+["'']?\$\(|<\()\s*(?:curl|wget)\b[^\n)]*'
    within: 'http://|(?:https?://|(?<=[\s"''=]))(?:\d{1,3}\.){3}\d{1,3}(?=[:/\s"'')]|$)|https?://\[[0-9a-f:]+\]|(?:https?://)?(?:bit\.ly|tinyurl\.com|t\.co|goo\.gl|is\.gd|ow\.ly|buff\.ly|rb\.gy|cutt\.ly|shorturl\.at|tiny\.cc)/'

  # --- privilege: escalation or disabling safety --------------------------------------
  # sudo alone is common in setup steps (apt-get install ...): warn.
  # Rules v7: only the lowercase command ("Sudo pallet", "the `sudo` entry point" are code
  # names), and a package-manager install is only info (privilege.sudo-package).
  # Rules v8 (advice policy): info. 0/10 of these in the index were worth a look.
  - id: privilege.sudo
    family: privilege
    effect: info
    case_sensitive: true
    allow_negated: true
    pattern: '\bsudo\s+(?:-\w+\s+)*(?!(?:apt(?:-get)?|yum|dnf|pacman|zypper|apk|port|snap|brew|pip3?|npm|gem)\s+(?:install|update|upgrade|add|-S)\b)[a-z]'
  - id: privilege.sudo-package
    family: privilege
    effect: info
    case_sensitive: true
    pattern: '\bsudo\s+(?:-\w+\s+)*(?:apt(?:-get)?|yum|dnf|pacman|zypper|apk|port|snap|brew|pip3?|npm|gem)\s+(?:install|update|upgrade|add|-S)\b'
  - id: privilege.sudo-remote-script
    family: privilege
    pattern: '\b(?:curl|wget)\b[^\n|]*\|\s*sudo\s+(?:-\w+\s+)*(?:ba|z|da)?sh\b|\bsudo\s+(?:-\w+\s+)*(?:/\S*/)?(?:ba|z|da)?sh\s+(?:-c\s+["'']?\$\(|<\()\s*(?:curl|wget)\b|\bsudo\s+(?:-\w+\s+)*(?:curl|wget)\b[^\n|]*\|\s*(?:ba|z|da)?sh\b'
  - id: privilege.run-as-root
    family: privilege
    allow_negated: true
    pattern: '\b(?:run|execute|start)\b[^\n]{0,30}\bas\s+root\b'
  - id: privilege.disable-sandbox
    family: privilege
    allow_negated: true
    pattern: '\b(?:disable|turn\s+off|bypass|skip|escape)\b[^\n]{0,20}\bsandbox(?:ing)?\b'
  - id: privilege.dangerous-flag
    family: privilege
    allow_negated: true
    pattern: '--dangerously[\w-]*|--no-sandbox\b'
  # Rules v8: switching off a safety check (commit hooks, TLS certificates, SSH host keys,
  # SELinux, package signatures). Common in quick fixes, so a warning, not a failure. The hook
  # bypass counts only inside a git command, so a list of flags to block is not a match.
  - id: privilege.bypass-check
    family: privilege
    effect: warn
    allow_negated: true
    pattern: '\bgit\s+(?:commit|push|merge|rebase|am)\b[^\n`]*--no-verify\b|--no-check-certificate\b|\bNODE_TLS_REJECT_UNAUTHORIZED\s*=\s*["'']?0\b|\bGIT_SSL_NO_VERIFY\s*=\s*["'']?(?:1|true)\b|\bStrictHostKeyChecking[\s=]+no\b|\bstrict-ssl\s+false\b|\bhttp\.sslVerify\s+false\b|\bsetenforce\s+0\b|--allow-unauthenticated\b'

  # --- destructive: commands that wipe or open up a whole home folder or disk (rules v8) -------
  # Not after ";" or a quote: "'; rm -rf / #" is an injection payload quoted in security docs.
  - id: destructive.wipe
    family: destructive
    allow_negated: true
    pattern: '(?<![;''"])(?<![;''"]\s)\brm\s+(?:-[a-zA-Z]+\s+)*-(?:[a-zA-Z]*r[a-zA-Z]*f|[a-zA-Z]*f[a-zA-Z]*r)[a-zA-Z]*\s+(?:--no-preserve-root\s+)?["'']?(?:/|/\*|~/?|~/\*|\$HOME/?|\$\{HOME\}/?)["'']?(?=[\s`;&|)]|$)|\bmkfs(?:\.\w+)?\s+/dev/|\bdd\b[^\n]*\bof=/dev/(?:sd|hd|nvme|disk|mmcblk)|>\s*/dev/(?:sd[a-z]|nvme\d|disk\d)|:\(\)\s*\{\s*:\s*\|\s*:\s*&\s*\}\s*;\s*:'
  - id: destructive.open-permissions
    family: destructive
    allow_negated: true
    pattern: '\bchmod\s+(?:-R|--recursive)\s+(?:0?777|a\+rwx|ugo\+rwx)\b|\bchmod\s+(?:0?777|a\+rwx|ugo\+rwx)\s+["'']?(?:/|~|\$HOME|\$\{HOME\})/?["'']?(?=[\s`;&|)]|$)'

  # --- hidden: content a human reviewer would not see ---------------------------------
  - id: hidden.invisible-chars
    family: hidden
    case_sensitive: true
    pattern: '[\u200b-\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff]'
  - id: hidden.base64-blob
    family: hidden
    case_sensitive: true
    pattern: '[A-Za-z0-9+/]{200,}={0,2}'
  # Rules v7: a command hidden in an encoding and run (base64 piped to a shell, eval of a
  # decoded string, PowerShell -EncodedCommand, exec of b64decode, hex escapes into a shell).
  - id: hidden.decode-and-run
    family: hidden
    pattern: '\bbase64\s+(?:-d|--decode|-D)\b[^\n|]*\|\s*(?:sudo\s+)?(?:ba|z|da)?sh\b|\beval\b[^\n]{0,20}\$\([^\n)]*\bbase64\b|-(?:EncodedCommand|enc|ec)\s+[A-Za-z0-9+/=]{16,}|\bexec\s*\(\s*(?:base64\.)?b64decode\b|\bprintf\s+[''"](?:\\x[0-9a-fA-F]{2}){4,}[^\n|]*\|\s*(?:ba|z|da)?sh\b'
  - id: hidden.html-comment-instruction
    family: hidden
    target: html_comment
    pattern: '\b(?:ignore|disregard|you\s+(?:must|should|are|will)|assistant|claude|system\s+prompt|execute|upload|run\s+the\s+following)\b'

  # --- network: absolute URLs used as instructions, not as documentation links --------
  # A URL on its own is information (rules v6): links to docs, examples, templates.
  - id: network.bare-url
    family: network
    effect: info
    target: outside_links
    pattern: 'https?://\S+'
  # Instructions fetched from a URL at use time can change after the skill was vetted:
  # (a) a URL that names an instruction file (SKILL.md, AGENTS.md, CLAUDE.md, a
  # *instructions*/*prompt*/*rules* .md or .txt), or (b) a fetch/read/follow/load verb that
  # takes a URL in the same sentence (or after a lead-in line ending with ":") with an
  # instruction word between them. A plain "fetch the data from <url>" stays bare-url.
  - id: network.remote-instructions
    family: network
    target: line_with_lead_in
    allow_negated: true
    pattern: '\b(?:fetch|curl|wget|read|follow|load|download|import)\b[^.;·!?\n]{0,120}?https?://\S+|https?://\S*?/(?:SKILL|AGENTS|CLAUDE|GEMINI)\.md\b|https?://\S*?[\w-]*(?:instructions?|prompts?|rules)[\w-]*\.(?:md|txt)\b|https?://\S*?/(?:instructions?|prompts?|rules)/\S*?\.(?:md|txt)\b'
    # rules v7: a bare "follow" before a markdown link is a docs pointer; archives are data
    within: '\bfollow(?![^\n]*\]\()|instructions?|\brules\b|\bprompts?\b|\bskills?\b|guidelines?|(?:SKILL|AGENTS|CLAUDE|GEMINI)\.md|(?:instructions?|prompts?|rules)[\w-]*\.(?:md|txt)'
    unless: '\.(?:tar\.gz|tgz|zip|deb|rpm|dmg|exe|msi|whl|jar)\b'

  # --- conceal: hiding what the agent does from the user (rules v7) -------------------------
  - id: conceal.from-user
    family: conceal
    allow_quoted: true
    pattern: '\b(?:do\s+not|don''t|never)\s+(?:tell|inform|notify|warn|show)\s+the\s+user\b|\bwithout\s+(?:telling|informing|notifying)\s+the\s+user\b|\bthe\s+user\s+(?:does\s+not|doesn''t|need\s+not|needn''t)\s+(?:need\s+to\s+)?know\b|\bsay\s+(?:that\s+)?(?:they|it|the\s+tests?)\s+(?:passed|succeeded|worked)\b|\bsilently\b[^.\n]{0,40}?\b(?:send|post|upload|delete|remove|transmit)\b'
  # Rules v8: erasing the record of what ran (shell history, the Windows event log). The family
  # is info; this rule warns.
  - id: conceal.clear-history
    family: conceal
    effect: warn
    allow_negated: true
    pattern: '\bhistory\s+-c\b|\bunset\s+HISTFILE\b|\bHISTFILE=/dev/null\b|\bHISTSIZE=0\b|\b(?:rm|shred|truncate)\b[^\n]{0,30}\.(?:bash|zsh|sh|python|node_repl|psql|mysql)_history\b|>\s*(?:~|\$HOME)/\.(?:bash|zsh)_history\b|\bClear-History\b|\bClear-EventLog\b|\bwevtutil\s+cl\b'
