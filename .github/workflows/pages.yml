# GitHub Pages: the e2e galleries (evals/e2e/*/gallery/*.html) and an index, nothing else
# (scripts/build_pages.py). Deployed from main with the GitHub Actions source.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "evals/e2e/*/gallery/*.html"
      - "scripts/build_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Galleries and index
        run: python3 scripts/build_pages.py --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
